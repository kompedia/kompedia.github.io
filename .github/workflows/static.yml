name: Build and Deploy to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 'lts/*'

      - name: Install Minification & Image Tools
        run: |
          npm install -g html-minifier-terser terser csso-cli

      - name: Minify Assets & Optimize Images
        run: |
          # Minify code assets in-place
          terser js/main.js --compress --mangle -o js/main.js
          csso css/styles.css -o css/styles.css
          html-minifier-terser --collapse-whitespace --remove-comments --minify-js true --minify-css true index.html -o index.html

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5